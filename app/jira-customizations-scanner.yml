---
settings:
  env:
    test_duration: 25m

~execution:
  - scenario: ${load_executor}
    executor: ${load_executor}
    concurrency: ${concurrency}
    hold-for: ${test_duration}
    ramp-up: ${ramp-up}
  - scenario: selenium
    executor: selenium
    runner: pytest
    iterations: 1
    hold-for: ${test_duration}
    # Authenticate and open the scanner before JMeter reaches peak; extension_ui waits through the ramp before clicking New Scan.
    delay: 0s
